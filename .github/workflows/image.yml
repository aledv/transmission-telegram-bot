# Lint + tests + multi-arch Docker image (linux/arm64, linux/amd64) on GHCR.
# Every push to main with green tests -> ghcr.io/aledv/transmission-telegram-bot:<short sha> and :latest.
name: test-and-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "18"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "18"
      - run: npm ci --no-audit --no-fund
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/aledv/transmission-telegram-bot:${{ steps.meta.outputs.short }}
            ghcr.io/aledv/transmission-telegram-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
